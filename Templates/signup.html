{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up | E-Menu</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">

  <!-- Bootstrap 5 CSS & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/bootstrap.min.css'%}">
  <link rel="stylesheet" href="{% static 'css/style.css'%}">
</head>
{% include 'header.html'%}

<body class="d-flex align-items-center justify-content-center min-vh-100" style="padding-top:0; background: radial-gradient(circle at 50% 50%, rgba(255, 107, 53, 0.12) 0%, rgba(248, 249, 250, 0.95) 100%);">

  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-12 col-sm-10 col-md-8 col-lg-6">

        <div class="text-center mb-4">
          <a href="{%url 'home'%}" class="d-inline-flex align-items-center gap-2 mb-2 text-decoration-none">
            <div class="brand-icon">
              <i class="bi bi-qr-code-scan"></i>
            </div>
            <span class="fs-2 fw-extrabold text-dark font-heading">E-Menu</span>
          </a>
          <p class="text-muted fs-sm">Create an account for personalized ordering & exclusive offers.</p>
        </div>

        <div class="glass-panel p-4 p-md-5 rounded-4 animate-slide-up">
          <form id="signupForm" method="POST" >
            {% csrf_token %}
            <div class="mb-3">
              <label for="signupName" class="form-label fw-semibold fs-sm">Full Name</label>
              <div class="input-group">
                <span class="input-group-text bg-light border-end-0"><i class="bi bi-person text-muted"></i></span>
                <input type="text"  name="UserFullName" id="signupName" class="form-control bg-light border-start-0" placeholder="Enter You Full Name Here..." required>
              </div>
            </div>

            <div class="row g-3 mb-3">
              <div class="col-md-6">
                <label for="signupEmail" class="form-label fw-semibold fs-sm">Email Address</label>
                <div class="input-group">
                  <span class="input-group-text bg-light border-end-0"><i class="bi bi-envelope text-muted"></i></span>
                  <input type="email" name="SignUpEmail" id="signupEmail" class="form-control bg-light border-start-0" placeholder="Email@gmail.com" required>
                </div>
              </div>
              <div class="col-md-6">
                <label for="signupPhone" class="form-label fw-semibold fs-sm">Phone Number</label>
                <div class="input-group">
                  <span class="input-group-text bg-light border-end-0"><i class="bi bi-telephone text-muted"></i></span>
                  <input type="tel" id="signupPhone" name="Phone" class="form-control bg-light border-start-0" placeholder="+91 1234567899" required>
                </div>
              </div>
            </div>

            <div class="row g-3 mb-4">
              <div class="col-md-6">
                <label for="signupPassword" class="form-label fw-semibold fs-sm">Password</label>
                <div class="input-group">
                  <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock text-muted"></i></span>
                  <input type="password" name="SignUpPassword" id="signupPassword" class="form-control bg-light border-start-0" placeholder="••••••••" required>
                </div>
              </div>
              <div class="col-md-6">
                <label for="signupConfirmPassword" class="form-label fw-semibold fs-sm">Confirm Password</label>
                <div class="input-group">
                  <span class="input-group-text bg-light border-end-0"><i class="bi bi-shield-check text-muted"></i></span>
                  <input type="password" name="SignUpConfirmPassword" id="signupConfirmPassword" class="form-control bg-light border-start-0" placeholder="••••••••" required>
                </div>
              </div>
            </div>

            <div class="form-check mb-4">
              <input type="checkbox" class="form-check-input" id="termsCheck" required checked>
              <label class="form-check-label fs-xs text-muted" for="termsCheck">
                I agree to the <a href="#" class="text-primary text-decoration-none">Terms of Service</a> & <a href="#" class="text-primary text-decoration-none">Privacy Policy</a>.
              </label>
            </div>

            <button type="submit" onclick="validation()" class="btn btn-primary-gradient w-100 py-3 fs-6 mb-3">
              <i class="bi bi-person-plus me-1"></i> Create Account
            </button>

            <div class="text-center">
              <span class="fs-xs text-muted">Already registered? </span>
              <a href="{% url 'login' %}" class="fs-xs fw-bold text-primary text-decoration-none">Login Here</a>
            </div>
          </form>
        </div>

      </div>
    </div>
  </div>

  <script src="{% static 'css/bootstrap.min.css' %}"></script>
  <script src="{% static 'js/script.js'%}"></script>
  <script>
    function validation() {

    var name = document.getElementById("signupName").value.trim();
    var email = document.getElementById("signupEmail").value.trim();
    var password = document.getElementById("signupPassword").value;
    var confirmPassword = document.getElementById("signupConfirmPassword").value;

    // Name
    if (name === "") {
        alert("Name is required");
        return false;
    }

    if (!/^[A-Za-z ]+$/.test(name)) {
        alert("Name should contain only letters");
        return false;
    }

    // Email
    let emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    if (!emailPattern.test(email)) {
        alert("Invalid email");
        return false;
    }

    // Password
    if (password.length < 8) {
        alert("Password must be at least 8 characters");
        return false;
    }

    // Confirm Password
    if (password !== confirmPassword) {
        alert("Passwords do not match");
        return false;
    }

    return true;
}
  </script>
</body>
</html>
