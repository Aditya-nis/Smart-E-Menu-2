{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Notifications</title>

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">

    <style>
        .notification-container{
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
        }

        .notification{
            min-width: 320px;
            margin-bottom: 15px;
            padding: 15px 20px;
            border-radius: 10px;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            animation: slideIn .4s ease;
            box-shadow: 0 5px 15px rgba(0,0,0,.2);
            transition: .5s;
        }

        .notification.success{
            background:#28a745;
        }

        .notification.error{
            background:#dc3545;
        }

        .notification.warning{
            background:#ffc107;
            color:#000;
        }

        .notification.info{
            background:#17a2b8;
        }

        .notification button{
            border:none;
            background:none;
            color:inherit;
            font-size:22px;
            cursor:pointer;
        }

        @keyframes slideIn{
            from{
                opacity:0;
                transform:translateX(100%);
            }
            to{
                opacity:1;
                transform:translateX(0);
            }
        }
    </style>
</head>

<body>

{% if messages %}
<div class="notification-container">

    {% for message in messages %}

    <div class="notification {{ message.tags }}">
        <span>{{ message }}</span>

        <button onclick="this.parentElement.remove()">
            &times;
        </button>
    </div>

    {% endfor %}

</div>
{% endif %}

<!-- Bootstrap JS -->
<script src="{% static 'js/bootstrap.bundle.min.js' %}"></script>

<script>
setTimeout(() => {

    document.querySelectorAll(".notification").forEach((item)=>{

        item.style.opacity="0";
        item.style.transform="translateX(100%)";

        setTimeout(()=>{
            item.remove();
        },500);

    });

},3000);
</script>

</body>
</html>
