{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | E-Menu</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">

  <!-- Bootstrap 5 CSS & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/bootstrap.min.css'%}">
  <link rel="stylesheet" href="{% static 'css/style.css'%}">

</head>
<body class="d-flex align-items-center justify-content-center min-vh-100" style="padding-top:0; background: radial-gradient(circle at 50% 50%, rgba(255, 107, 53, 0.12) 0%, rgba(248, 249, 250, 0.95) 100%);">
{% include 'header.html' %}




  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-12 col-sm-10 col-md-8 col-lg-5">

        <div class="text-center mb-4">
          <a href="{% url 'home' %}" class="d-inline-flex align-items-center gap-2 mb-2 text-decoration-none">
            <div class="brand-icon">
              <i class="bi bi-qr-code-scan"></i>
            </div>
            <span class="fs-2 fw-extrabold text-dark font-heading">E-Menu</span>
          </a>
          <p class="text-muted fs-sm">Welcome Back! Login to manage your dining orders.</p>
        </div>

        <div class="glass-panel p-4 p-md-5 rounded-4 animate-slide-up">
          <form id="loginForm" method="POST" onsubmit="return validateLogin()">
            {% csrf_token %}
            {% if messages %}
              {% for message in messages %}
                <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags }}{% endif %} fs-xs mb-3">
                  {{ message }}
                </div>
              {% endfor %}
            {% endif %}
            <div class="mb-3">
              <label for="loginEmail" class="form-label fw-semibold fs-sm">Email Address</label>
              <div class="input-group" >
                <span class="input-group-text bg-light border-end-0"><i class="bi bi-envelope text-muted"></i></span>
                <input type="email" name="LoginEmail" id="loginEmail" class="form-control bg-light border-start-0" placeholder="UserName@gmail.com" required>
              </div>
              <small id="emailError" class="text-danger"></small>
            </div>

            <div class="mb-3">
              <div class="d-flex justify-content-between align-items-center mb-1">
                <label for="loginPassword" class="form-label fw-semibold fs-sm mb-0">Password</label>
                <a href="#" class="fs-xs text-primary text-decoration-none">Forgot Password?</a>
              </div>
              <div class="input-group">
                <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock text-muted"></i></span>
                <input type="password" name="Password" id="loginPassword" class="form-control bg-light border-start-0" placeholder="••••••••" required>
              </div>
               <small id="passwordError" class="text-danger"></small>
            </div>

            <div class="form-check mb-4">
              <input type="checkbox" class="form-check-input" id="rememberMe" checked>
              <label class="form-check-label fs-xs text-muted" for="rememberMe">Remember me on this device</label>
            </div>

            <button type="submit" class="btn btn-primary-gradient w-100 py-3 fs-6 mb-3">
              <i class="bi bi-box-arrow-in-right me-1"></i> Login to E-Menu
            </button>

            <div class="text-center">
              <span class="fs-xs text-muted">Don't have an account? </span>
              <a href="{% url 'signup'%}" class="fs-xs fw-bold text-primary text-decoration-none">Sign Up Now</a>
            </div>
          </form>
        </div>


      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="{% static 'js/script.js'%}"></script>
  <script>
    function validateLogin() {
      let email = document.getElementById("loginEmail").value.trim();
      let password = document.getElementById("loginPassword").value.trim();

      let emailError = document.getElementById("emailError");
      let passwordError = document.getElementById("passwordError");

      emailError.innerHTML = "";
      passwordError.innerHTML = "";

      let isValid = true;

      if (email === "") {
          emailError.innerHTML = "Email is required";
          isValid = false;
      }

      if (password === "") {
          passwordError.innerHTML = "Password is required";
          isValid = false;
      }

      return isValid;
    }
  </script>
</body>
</html>
