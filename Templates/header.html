{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Full Restaurant Menu | E-Menu</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">

  <!-- Bootstrap 5 CSS & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/bootstrap.min.css'%}">
  <link rel="stylesheet" href="{% static 'css/style.css'%}">
</head>
<body>

  <!-- ==========================================
       NAVBAR
       ========================================== -->
  <nav class="navbar navbar-expand-lg fixed-top glass-navbar py-2 py-lg-3">
    <div class="container flex-nowrap align-items-center justify-content-between">
      <a class="navbar-brand me-2 me-sm-3" href="{% url 'home'%}">
        <div class="brand-icon">
          <i class="bi bi-qr-code-scan"></i>
        </div>
        <div>
          <span class="fw-extrabold">E-Menu</span>
          <span class="d-none d-sm-block text-muted fs-xs font-normal" style="font-size: 0.65rem; margin-top: -4px;">DIGITAL DINING</span>
        </div>
      </a>

      <!-- Mobile Right Controls (Single Line, No Wrap) -->
      <div class="d-flex align-items-center gap-1.5 gap-sm-2 d-lg-none">
        <a href="{% url 'tables'%}" class="table-pill-btn-sm" id="tablePillNavMobile">
          <i class="bi bi-geo-alt-fill text-primary"></i> <span class="table-name-text"></span>
        </a>
        <button class="btn btn-light rounded-circle call-waiter-btn-top p-2" onclick="callWaiterAction()" title="Call Waiter to Table">
          <i class="bi bi-bell-fill text-warning fs-6"></i>
        </button>
        <a href="{% url 'cart'%}" class="btn btn-light rounded-circle cart-badge-icon p-2 position-relative">
          <i class="bi bi-cart3 fs-6"></i>
          <span class="badge cart-count-badge d-none">0</span>
        </a>
        <button class="navbar-toggler border-0 p-1" type="button" data-bs-toggle="offcanvas" data-bs-target="#mobileNavDrawer" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
      </div>

      <!-- Desktop Collapse Navbar -->
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav mx-auto mb-2 mb-lg-0 gap-lg-2">
          <li class="nav-item"><a class="nav-link" href="{% url 'home'%}">Home</a></li>
          <li class="nav-item"><a class="nav-link " href="{% url 'menu'%}">Menu</a></li>
          <li class="nav-item"><a class="nav-link" href="{% url 'tables'%}">Tables</a></li>
          <li class="nav-item"><a class="nav-link" href="{% url 'order-tracking'%}">Order Status</a></li>
          <li class="nav-item"><a class="nav-link" href="{% url 'kitchen_dashboard'%}">Kitchen</a></li>
          <li class="nav-item"><a class="nav-link" href="{% url 'bill'%}">Billing</a></li>
        </ul>

        <div class="d-none d-lg-flex align-items-center gap-2 gap-xl-3">
          <a href="{% url 'tables'%}" class="table-pill-btn" id="tablePillNav">
            <i class="bi bi-geo-alt-fill text-primary me-1"></i> <span class="table-name-text">Table 4</span>
          </a>
          <button class="btn btn-outline-warning rounded-pill px-3 py-1.5 fs-xs fw-bold call-waiter-trigger-btn" onclick="callWaiterAction()">
            <i class="bi bi-bell-fill me-1"></i> Call Waiter
          </button>
          <a href="{%url 'cart'%}" class="btn btn-light rounded-circle cart-badge-icon p-2">
            <i class="bi bi-cart3 fs-5"></i>
            <span class="badge cart-count-badge d-none">0</span>
          </a>
          <a href="{% url 'login' %}" class="btn btn-light rounded-circle p-2">
           <i class="bi bi-person fs-5"></i>
          </a>
        </div>
      </div>
    </div>
  </nav>
</body>
